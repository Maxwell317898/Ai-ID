<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face ID Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .subtitle {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 48px;
        }

        .face-container {
            position: relative;
            width: 256px;
            height: 256px;
            margin: 0 auto 48px;
        }

        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        video.active {
            opacity: 1;
        }

        .face-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .face-icon-circle {
            width: 192px;
            height: 192px;
            border-radius: 50%;
            border: 4px solid #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .face-icon svg {
            width: 96px;
            height: 96px;
            stroke: #fff;
        }

        .scan-ring {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #007aff;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .scan-ring.active {
            opacity: 1;
            animation: pulse 2s ease-in-out infinite;
        }

        .scan-ring-outer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #0a84ff;
            opacity: 0;
        }

        .scan-ring-outer.active {
            opacity: 0.6;
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .success-icon, .failed-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .success-icon.active, .failed-icon.active {
            opacity: 1;
            transform: scale(1);
        }

        .success-circle {
            width: 192px;
            height: 192px;
            border-radius: 50%;
            background-color: #34c759;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .failed-circle {
            width: 192px;
            height: 192px;
            border-radius: 50%;
            background-color: #ff3b30;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg, .failed-icon svg {
            width: 96px;
            height: 96px;
            stroke: #fff;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #fff;
            color: #000;
        }

        .btn-primary:active {
            background-color: #e5e5e5;
        }

        .btn-secondary {
            background-color: #1c1c1e;
            color: #fff;
            margin-top: 12px;
        }

        .btn-secondary:active {
            background-color: #2c2c2e;
        }

        .btn-retry {
            background-color: #007aff;
            color: #fff;
        }

        .btn-retry:active {
            background-color: #0051d5;
        }

        .hidden {
            display: none;
        }

        .scan-ring.authenticating {
            border-color: #34c759;
            animation: pulse 0.8s ease-in-out infinite;
        }

        .scan-ring-outer.authenticating {
            border-color: #34c759;
            opacity: 0.8;
        }


        .scan-ring.unknown {
            border-color: #ff3b30;
            animation: pulse 0.7s ease-in-out infinite;
        }

        .scan-ring-outer.unknown {
            border-color: #ff3b30;
            opacity: 0.8;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes ping {
            75%, 100% {
                transform: scale(1.1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Face ID</h1>
        <p class="subtitle" id="subtitle">Tap to authenticate</p>

        <div class="face-container">
            <video id="video" autoplay playsinline muted></video>

            <div class="face-icon" id="faceIcon">
                <div class="face-icon-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
            </div>

            <div class="scan-ring" id="scanRing"></div>
            <div class="scan-ring-outer" id="scanRingOuter"></div>

            <div class="success-icon" id="successIcon">
                <div class="success-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>

            <div class="failed-icon" id="failedIcon">
                <div class="failed-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </div>
            </div>
        </div>

        <button class="btn btn-primary" id="authBtn">
            Authenticate with Face ID
        </button>
        <button class="btn btn-secondary hidden" id="againBtn">
            Authenticate Again
        </button>
        <button class="btn btn-retry hidden" id="retryBtn">
            Try Again
        </button>
    </div>

    <script>
        var model;
        var video = document.getElementById('video');
        var animationId;
        var status = 'idle';

        var AUTH_THRESHOLD = 0.95;
        var HOLD_TIME_MS = 1000;

        var authStartTime = null;
        var isHolding = false;

        var ME_THRESHOLD = 0.95;
var ME_HOLD_MS = 1000;

var NOTHING_THRESHOLD = 0.65;
var NOTHING_HOLD_MS = 5000;

var meStartTime = null;
var nothingStartTime = null;

var meHolding = false;
var nothingHolding = false;


        var MODEL_URL = './model.json';
        var METADATA_URL = './metadata.json';

        function init() {
            tmImage.load(MODEL_URL, METADATA_URL).then(function(loadedModel) {
                model = loadedModel;
                console.log('Model loaded successfully');
            }).catch(function(error) {
                console.error('Error loading model:', error);
                alert('Failed to load model. Make sure model.json and metadata.json are in the same folder.');
            });
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' },
                audio: false 
            }).then(function(stream) {
                video.srcObject = stream;
            }).catch(function(error) {
                console.error('Error accessing camera:', error);
                alert('Unable to access camera. Please grant camera permissions.');
            });
        }


function setAuthenticatingUI(active) {
    var scanRing = document.getElementById('scanRing');
    var scanRingOuter = document.getElementById('scanRingOuter');
    var subtitle = document.getElementById('subtitle');

    scanRing.classList.remove('unknown');
    scanRingOuter.classList.remove('unknown');

    if (active) {
        scanRing.classList.add('authenticating');
        scanRingOuter.classList.add('authenticating');
        subtitle.textContent = 'Authenticating…';
    } else {
        scanRing.classList.remove('authenticating');
        scanRingOuter.classList.remove('authenticating');
        subtitle.textContent = 'Position your face in the frame';
    }
}


        function predict() {
    if (!model || status !== 'scanning') return;

    model.predict(video).then(function(predictions) {
        // IMPORTANT: match your model order
        var me = predictions.find(p => p.className === 'me');
        var nothing = predictions.find(p => p.className === 'nothing');

        var now = performance.now();

        console.log(
            'me:', me.probability.toFixed(3),
            'nothing:', nothing.probability.toFixed(3)
        );

        // ===== ME AUTHENTICATION =====
        if (me.probability >= ME_THRESHOLD) {
            if (!meHolding) {
                meHolding = true;
                meStartTime = now;
                setAuthenticatingUI(true);
            } else if (now - meStartTime >= ME_HOLD_MS) {
                showSuccess();
                stopScanning();
                return;
            }
        } else {
            meHolding = false;
            meStartTime = null;
        }

        // ===== UNKNOWN FACE =====
        if (nothing.probability >= NOTHING_THRESHOLD) {
            if (!nothingHolding) {
                nothingHolding = true;
                nothingStartTime = now;
                setUnknownUI(true);
            } else if (now - nothingStartTime >= NOTHING_HOLD_MS) {
                showFailed();
                stopScanning();
                return;
            }
        } else {
            nothingHolding = false;
            nothingStartTime = null;
            if (!meHolding) setUnknownUI(false);
        }

        animationId = requestAnimationFrame(predict);
    });
}

function setUnknownUI(active) {
    var scanRing = document.getElementById('scanRing');
    var scanRingOuter = document.getElementById('scanRingOuter');
    var subtitle = document.getElementById('subtitle');

    scanRing.classList.remove('authenticating');

    if (active) {
        scanRing.classList.add('unknown');
        scanRingOuter.classList.add('unknown');
        subtitle.textContent = 'Unknown face…';
    } else {
        scanRing.classList.remove('unknown');
        scanRingOuter.classList.remove('unknown');
    }
}


        function startAuth() {
            if (!model) {
                alert('Model not loaded yet. Please wait...');
                return;
            }

            status = 'scanning';
            updateUI();
            startCamera();
            
            setTimeout(function() {
                video.classList.add('active');
                predict();
            }, 500);
        }

        function stopScanning() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(function(track) {
                    track.stop();
                });
            }
        }

        function showSuccess() {
            status = 'success';
            updateUI();
        }

        function showFailed() {
            status = 'failed';
            updateUI();
        }

function reset() {
    stopScanning();
    status = 'idle';

    meHolding = false;
    nothingHolding = false;
    meStartTime = null;
    nothingStartTime = null;

    video.classList.remove('active');
    updateUI();
}



        function updateUI() {
            var title = document.getElementById('title');
            var subtitle = document.getElementById('subtitle');
            var faceIcon = document.getElementById('faceIcon');
            var scanRing = document.getElementById('scanRing');
            var scanRingOuter = document.getElementById('scanRingOuter');
            var successIcon = document.getElementById('successIcon');
            var failedIcon = document.getElementById('failedIcon');
            var authBtn = document.getElementById('authBtn');
            var againBtn = document.getElementById('againBtn');
            var retryBtn = document.getElementById('retryBtn');

            faceIcon.style.opacity = '0';
            scanRing.classList.remove('active');
            scanRingOuter.classList.remove('active');
            successIcon.classList.remove('active');
            failedIcon.classList.remove('active');
            authBtn.classList.add('hidden');
            againBtn.classList.add('hidden');
            retryBtn.classList.add('hidden');

            if (status === 'idle') {
                title.textContent = 'Face ID';
                subtitle.textContent = 'Tap to authenticate';
                faceIcon.style.opacity = '1';
                authBtn.classList.remove('hidden');
            } else if (status === 'scanning') {
                title.textContent = 'Scanning...';
                subtitle.textContent = 'Position your face in the frame';
                scanRing.classList.add('active');
                scanRingOuter.classList.add('active');
            } else if (status === 'success') {
                title.textContent = 'Authenticated';
                subtitle.textContent = 'Authentication successful';
                successIcon.classList.add('active');
                againBtn.classList.remove('hidden');
            } else if (status === 'failed') {
                title.textContent = 'Failed';
                subtitle.textContent = 'Face not recognized';
                failedIcon.classList.add('active');
                retryBtn.classList.remove('hidden');
            }
        }

        document.getElementById('authBtn').addEventListener('click', startAuth);
        document.getElementById('againBtn').addEventListener('click', reset);
        document.getElementById('retryBtn').addEventListener('click', reset);

        init();
    </script>
</body>
</html>
